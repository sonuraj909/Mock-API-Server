<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Studio — Mock Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0f14;--bg2:#12151c;--bg3:#181c25;--bg4:#1e2330;
  --border:#2a3040;--border2:#3a4560;
  --text:#e8eaf0;--text2:#9aa3b8;--text3:#5a6480;
  --accent:#00d4a0;--accent2:#00b589;--accent-bg:rgba(0,212,160,0.08);--accent-border:rgba(0,212,160,0.25);
  --red:#ff5f6d;--red-bg:rgba(255,95,109,0.1);
  --yellow:#ffc947;--yellow-bg:rgba(255,201,71,0.1);
  --blue:#4d9de0;--blue-bg:rgba(77,157,224,0.1);
  --purple:#b06cff;--purple-bg:rgba(176,108,255,0.1);
  --font-mono:'JetBrains Mono',monospace;
  --font-display:'Syne',sans-serif;
  --r:6px;--r2:10px;
}
body{font-family:var(--font-mono);background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden}

/* LAYOUT */
.app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:52px 1fr;height:100vh}
.header{grid-column:1/-1;display:flex;align-items:center;padding:0 20px;gap:14px;background:var(--bg2);border-bottom:1px solid var(--border);z-index:10}
.logo{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--accent);letter-spacing:-0.02em}
.logo em{color:var(--text3);font-style:normal;font-weight:400;font-size:13px;margin-left:6px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.server-badge{display:flex;align-items:center;gap:6px;background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--accent);cursor:pointer}
.server-badge:hover{background:rgba(0,212,160,0.15)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s ease infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}

.sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-head{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.sidebar-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;font-family:var(--font-display)}
.add-ep-btn{width:100%;padding:8px 12px;background:var(--accent);color:#000;border:none;border-radius:var(--r);font-family:var(--font-mono);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.add-ep-btn:hover{background:var(--accent2)}
.sidebar-search{margin-top:8px;position:relative}
.sidebar-search input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px 6px 30px;font-family:var(--font-mono);font-size:12px;color:var(--text);outline:none}
.sidebar-search input:focus{border-color:var(--accent-border)}
.sidebar-search i{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.ep-list{flex:1;overflow-y:auto;padding:8px}
.ep-list::-webkit-scrollbar{width:4px}
.ep-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.ep-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);cursor:pointer;transition:background .1s;margin-bottom:2px}
.ep-item:hover{background:var(--bg3)}
.ep-item.active{background:var(--bg4);outline:1px solid var(--border2)}
.ep-item.disabled{opacity:.45}
.method-tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;min-width:40px;text-align:center;letter-spacing:.04em}
.GET{background:rgba(0,212,160,.15);color:var(--accent)}.POST{background:var(--blue-bg);color:var(--blue)}.PUT{background:var(--yellow-bg);color:var(--yellow)}.DELETE{background:var(--red-bg);color:var(--red)}.PATCH{background:var(--purple-bg);color:var(--purple)}
.ep-path-text{flex:1;font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* MAIN */
.main{overflow-y:auto;background:var(--bg)}
.main::-webkit-scrollbar{width:5px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.main-inner{padding:20px;max-width:880px}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);margin-bottom:14px;overflow:hidden}
.card-hdr{padding:11px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--text2)}
.card-hdr i{font-size:15px;color:var(--text3)}
.card-body{padding:16px}

/* FORM */
.frow{display:grid;gap:10px;margin-bottom:12px}
.frow-3{grid-template-columns:auto 1fr auto}
.frow-2{grid-template-columns:1fr 1fr}
.frow-4{grid-template-columns:1fr 1fr 1fr 1fr}
label{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);display:block;margin-bottom:5px;font-family:var(--font-display)}
input,select,textarea{width:100%;font-family:var(--font-mono);font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;color:var(--text);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent-border);box-shadow:0 0 0 3px rgba(0,212,160,.06)}
select option{background:var(--bg2)}
textarea{resize:vertical;min-height:140px;line-height:1.6}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab-btn{padding:8px 14px;font-size:11px;font-family:var(--font-mono);cursor:pointer;color:var(--text3);border:none;background:none;border-bottom:2px solid transparent;transition:all .15s}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover:not(.active){color:var(--text)}
.tab-count{font-size:9px;background:var(--border2);color:var(--text3);padding:1px 5px;border-radius:10px;margin-left:4px}

/* BUTTONS */
.btn{padding:7px 14px;font-size:12px;font-family:var(--font-mono);border-radius:var(--r);cursor:pointer;border:1px solid;transition:all .12s;font-weight:500}
.btn-primary{background:var(--accent);color:#000;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border-color:var(--border2)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:rgba(255,95,109,.25)}
.btn-danger:hover{background:rgba(255,95,109,.2)}
.btn-sm{padding:5px 10px;font-size:11px}
.icon-btn{padding:5px 7px;background:transparent;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;color:var(--text3);display:flex;align-items:center;font-size:14px;transition:all .12s}
.icon-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.icon-btn.danger:hover{color:var(--red);border-color:rgba(255,95,109,.4)}

/* CHIPS */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:3px 9px;border-radius:12px;cursor:pointer;transition:all .12s;border:1px solid}
.chip-off{background:var(--bg3);color:var(--text3);border-color:var(--border)}
.chip-off:hover{border-color:var(--border2);color:var(--text)}
.chip-on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}

/* HEADER ROWS (headers/params table) */
.hrow{display:grid;gap:8px;margin-bottom:6px;align-items:center}
.hrow-kv{grid-template-columns:1fr 1fr auto}
.hrow-param{grid-template-columns:1fr 80px 80px 60px auto}

/* CODE / RESPONSE */
.code-block{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:12px;line-height:1.7;overflow-x:auto;position:relative}
.code-block pre{margin:0;white-space:pre-wrap;word-break:break-word}
.copy-overlay{position:absolute;top:8px;right:8px}

/* TRY PANEL */
.try-panel{background:var(--bg3);border-radius:var(--r2);padding:14px}
.try-result{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:11px;line-height:1.8;white-space:pre;overflow-x:auto;max-height:240px;overflow-y:auto;margin-top:12px}

/* SCENARIO CARDS */
.scenario-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:8px;position:relative}
.scenario-card.active-scenario{border-color:var(--accent-border)}
.scenario-active-badge{position:absolute;top:8px;right:8px;font-size:9px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);padding:1px 7px;border-radius:10px}

/* SCHEMA VIEWER */
.schema-error{color:var(--red);font-size:11px;padding:8px 10px;background:var(--red-bg);border-radius:var(--r);margin-top:6px;border:1px solid rgba(255,95,109,.2)}

/* URL BANNER */
.url-banner{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border:1px solid var(--accent-border);border-radius:var(--r2);margin-bottom:14px;font-size:12px}
.url-banner .base{color:var(--accent)}.url-banner .path{color:var(--text)}
.url-banner .method-label{font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px}

/* VALIDATION PILL */
.v-pass{color:var(--accent)}.v-fail{color:var(--red)}.v-warn{color:var(--yellow)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);width:440px;max-height:90vh;overflow-y:auto}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;font-family:var(--font-display)}
.modal-body{padding:18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 16px;font-size:12px;z-index:9999;display:flex;align-items:center;gap:8px;animation:toast-in .2s ease;pointer-events:none;max-width:320px}
@keyframes toast-in{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast-ok{border-color:var(--accent-border);color:var(--accent)}.toast-err{border-color:rgba(255,95,109,.4);color:var(--red)}

/* EMPTY */
.empty{text-align:center;padding:80px 20px;color:var(--text3)}
.empty i{font-size:44px;display:block;margin-bottom:14px;color:var(--border2)}
.empty p{font-size:13px;margin-bottom:18px;color:var(--text2)}

/* STATUS COLORS */
.s2{color:var(--accent)}.s3{color:var(--blue)}.s4{color:var(--yellow)}.s5{color:var(--red)}

/* HINT */
.hint{font-size:10px;color:var(--text3);margin-top:5px}

/* SCHEMA VALIDATOR RESULT */
.sv-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px}
.sv-row:last-child{border-bottom:none}
.sv-field{color:var(--text2);min-width:120px}
.sv-type{color:var(--text3);font-size:10px}
.sv-ok{color:var(--accent)}.sv-bad{color:var(--red)}

/* TABS PANEL hide/show */
.tab-panel{display:none}.tab-panel.show{display:block}
</style>
</head>
<body>

<div class="app" id="app">

<!-- HEADER -->
<div class="header">
  <div class="logo">API Studio <em>mock server</em></div>
  <div style="display:flex;gap:6px;margin-left:10px">
    <span style="font-size:10px;color:var(--text3)">v2.0</span>
  </div>
  <div class="header-right">
    <div class="server-badge" onclick="showConfigModal()" title="Click to change base URL">
      <div class="pulse"></div>
      <span id="hdr-baseurl">http://localhost:3000</span>
    </div>
    <div id="sync-badge" style="display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);color:var(--text3)" title="Sync status">
      <span id="sync-dot" style="width:6px;height:6px;border-radius:50%;background:var(--text3);flex-shrink:0"></span>
      <span id="sync-label">not synced</span>
    </div>
    <button class="icon-btn" onclick="exportOpenAPI()" title="Export OpenAPI 3.0 JSON"><i class="ti ti-file-code"></i></button>
    <button class="icon-btn" onclick="exportHTML()" title="Export standalone HTML mock server"><i class="ti ti-download"></i></button>
    <button class="icon-btn" onclick="importSpec()" title="Import OpenAPI JSON"><i class="ti ti-upload"></i></button>
    <button class="icon-btn" onclick="shareLink()" title="Share via URL (state encoded)"><i class="ti ti-share"></i></button>
    <button class="icon-btn" onclick="showHelpModal()" title="Help"><i class="ti ti-help-circle"></i></button>
  </div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-head">
    <div class="sidebar-title">Endpoints</div>
    <button class="add-ep-btn" onclick="addEndpoint()"><i class="ti ti-plus" style="font-size:14px"></i> New Endpoint</button>
    <div class="sidebar-search">
      <i class="ti ti-search"></i>
      <input id="ep-search" placeholder="Filter endpoints..." oninput="renderSidebar()">
    </div>
  </div>
  <div class="ep-list" id="ep-list"></div>
  <div style="padding:10px 12px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);display:flex;justify-content:space-between">
    <span id="ep-count">0 endpoints</span>
    <button style="background:none;border:none;color:var(--text3);font-size:10px;cursor:pointer;font-family:var(--font-mono)" onclick="clearAll()">Clear all</button>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="main-inner" id="main-inner">
    <div class="empty" id="empty-state">
      <i class="ti ti-api-app"></i>
      <p>No endpoints yet.<br>Create one to start building your mock API.</p>
      <button class="btn btn-primary" onclick="addEndpoint()">+ Add first endpoint</button>
    </div>
  </div>
</div>

</div><!-- /app -->

<div id="modal-root"></div>
<div id="toast-root"></div>
<input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
const METHODS = ['GET','POST','PUT','PATCH','DELETE','HEAD','OPTIONS'];
const STATUS_TEXTS = {200:'OK',201:'Created',202:'Accepted',204:'No Content',301:'Moved Permanently',302:'Found',400:'Bad Request',401:'Unauthorized',403:'Forbidden',404:'Not Found',405:'Method Not Allowed',409:'Conflict',422:'Unprocessable Entity',429:'Too Many Requests',500:'Internal Server Error',502:'Bad Gateway',503:'Service Unavailable'};
const CONTENT_TYPES = ['application/json','text/plain','text/html','application/xml','application/x-www-form-urlencoded'];

let state = {
  baseUrl: 'http://localhost:3000',
  endpoints: [],
  selected: null,
  tab: 'response'
};

// ─── DEFAULT ENDPOINT ───────────────────────────────────────────────────────
const newEP = (n=0) => ({
  id: crypto.randomUUID(),
  method: 'GET',
  path: '/api/resource' + (n ? '-'+n : ''),
  description: '',
  tags: [],
  enabled: true,
  authRequired: false,
  delay: 0,
  statusCode: 200,
  contentType: 'application/json',
  responseBody: JSON.stringify({success:true,message:"Hello from Mock API",data:[],timestamp:"{{timestamp}}"},null,2),
  headers: [
    {key:'Content-Type',value:'application/json'},
    {key:'Access-Control-Allow-Origin',value:'*'},
    {key:'X-Powered-By',value:'API Studio'}
  ],
  params: [],
  scenarios: [],
  activeScenario: null,
  requestSchema: '',
  notes: ''
});

// ─── SYNC TO SERVER ──────────────────────────────────────────────────────────
async function syncToServer() {
  const dot   = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  try {
    const res = await fetch(state.baseUrl + '/__config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoints: state.endpoints })
    });
    if (res.ok) {
      if (dot)   { dot.style.background = 'var(--accent)'; }
      if (label) { label.style.color = 'var(--accent)'; label.textContent = state.endpoints.length + ' endpoints live'; }
    } else { throw new Error('bad response'); }
  } catch {
    if (dot)   { dot.style.background = 'var(--text3)'; }
    if (label) { label.style.color = 'var(--text3)'; label.textContent = 'server offline'; }
  }
}

// ─── SAVE / LOAD ─────────────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem('apistudio_state', JSON.stringify(state)); } catch(e){}
  syncToServer();
}
function load() {
  try {
    const s = localStorage.getItem('apistudio_state');
    if (s) { state = {...state, ...JSON.parse(s)}; return true; }
  } catch(e){}
  return false;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() { renderSidebar(); renderMain(); save(); }

function renderSidebar() {
  const query = (document.getElementById('ep-search')?.value || '').toLowerCase();
  const list = document.getElementById('ep-list');
  const filtered = state.endpoints.filter(ep =>
    ep.path.toLowerCase().includes(query) ||
    ep.method.toLowerCase().includes(query) ||
    (ep.description||'').toLowerCase().includes(query)
  );
  document.getElementById('ep-count').textContent = `${state.endpoints.length} endpoint${state.endpoints.length!==1?'s':''}`;
  list.innerHTML = filtered.length === 0
    ? `<div style="padding:16px;text-align:center;font-size:11px;color:var(--text3)">No endpoints found</div>`
    : filtered.map(ep => `
      <div class="ep-item ${ep.id===state.selected?'active':''} ${!ep.enabled?'disabled':''}"
           onclick="selectEP('${ep.id}')">
        <span class="method-tag ${ep.method}">${ep.method}</span>
        <span class="ep-path-text" title="${ep.path}">${ep.path}</span>
        ${ep.enabled?'<span class="ep-dot"></span>':'<i class="ti ti-eye-off" style="font-size:11px;color:var(--text3)"></i>'}
      </div>
    `).join('');
}

function renderMain() {
  const ep = state.endpoints.find(e => e.id === state.selected);
  const m = document.getElementById('main-inner');
  if (!ep) {
    m.innerHTML = `<div class="empty"><i class="ti ti-api-app"></i><p>Select an endpoint or create a new one.</p><button class="btn btn-primary" onclick="addEndpoint()">+ New endpoint</button></div>`;
    return;
  }
  const sClass = ep.statusCode<300?'s2':ep.statusCode<400?'s3':ep.statusCode<500?'s4':'s5';
  const activeScenario = ep.scenarios?.find(s=>s.id===ep.activeScenario);

  m.innerHTML = `
  <div class="url-banner">
    <span class="method-label ${ep.method}">${ep.method}</span>
    <span class="base">${state.baseUrl}</span><span class="path">${ep.path}</span>
    <div style="margin-left:auto;display:flex;gap:6px">
      <span class="chip ${ep.enabled?'chip-on':'chip-off'}" onclick="toggleField('enabled')">${ep.enabled?'● Active':'○ Off'}</span>
      <span class="chip ${ep.authRequired?'chip-on':'chip-off'}" onclick="toggleField('authRequired')"><i class="ti ti-lock" style="font-size:10px"></i> Auth</span>
      ${ep.tags.map(t=>`<span class="chip chip-on" style="font-size:9px">${t}</span>`).join('')}
    </div>
  </div>

  <!-- DEFINITION CARD -->
  <div class="card">
    <div class="card-hdr"><i class="ti ti-route"></i> Endpoint Definition</div>
    <div class="card-body">
      <div class="frow frow-3">
        <div>
          <label>Method</label>
          <select style="width:95px" onchange="updateEP('method',this.value)">
            ${METHODS.map(m=>`<option ${ep.method===m?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
        <div>
          <label>Path</label>
          <input value="${esc(ep.path)}" oninput="updateEP('path',this.value)" placeholder="/api/users/:id">
        </div>
        <div>
          <label>Status</label>
          <select style="width:90px" onchange="updateEP('statusCode',parseInt(this.value))">
            ${Object.keys(STATUS_TEXTS).map(s=>`<option ${ep.statusCode==s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="frow frow-2">
        <div>
          <label>Description</label>
          <input value="${esc(ep.description)}" oninput="updateEP('description',this.value)" placeholder="What does this do?">
        </div>
        <div>
          <label>Tags (comma-separated)</label>
          <input value="${esc(ep.tags.join(','))}" oninput="updateEP('tags',this.value.split(',').map(t=>t.trim()).filter(Boolean))" placeholder="users, auth, v1">
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:16px">
        <div style="flex:1">
          <label>Response Delay</label>
          <div style="display:flex;align-items:center;gap:8px">
            <input type="range" min="0" max="5000" step="100" value="${ep.delay}" style="flex:1" oninput="updateEP('delay',parseInt(this.value));document.getElementById('delay-out').textContent=this.value+'ms'">
            <span id="delay-out" style="font-size:12px;color:var(--text2);min-width:44px">${ep.delay}ms</span>
          </div>

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function syntaxHL(str) {
  try {
    return JSON.stringify(JSON.parse(str),null,2)
      .replace(/("[\w\s-]+")\s*:/g,'<span style="color:var(--blue)">$1</span>:')
      .replace(/:\s*("(?:[^"\\]|\\.)*")/g,(_,v)=>`: <span style="color:var(--accent)">${v}</span>`)
      .replace(/:\s*(true|false|null)/g,(_,v)=>`: <span style="color:var(--yellow)">${v}</span>`)
      .replace(/:\s*(-?\d+\.?\d*)/g,(_,v)=>`: <span style="color:var(--purple)">${v}</span>`);
  } catch { return esc(str); }
}

function resolveFakers(body) {
  const names = ['Alice Johnson','Bob Smith','Carol White','Dani Patel','Eve Zhang'];
  const emails = ['alice@demo.io','bob@test.com','carol@example.net'];
  const phones = ['+1-555-0172','+44-20-7123-4567','+91-98765-43210'];
  return body
    .replace(/\{\{timestamp\}\}/g, new Date().toISOString())
    .replace(/\{\{uuid\}\}/g, crypto.randomUUID())
    .replace(/\{\{faker\.name\}\}/g, names[Math.floor(Math.random()*names.length)])
    .replace(/\{\{faker\.email\}\}/g, emails[Math.floor(Math.random()*emails.length)])
    .replace(/\{\{faker\.phone\}\}/g, phones[Math.floor(Math.random()*phones.length)])
    .replace(/\{\{random\.int\}\}/g, String(Math.floor(Math.random()*1000)));
}

function renderMarkdown(md) {
  return md
    .replace(/^# (.*)/gm,'<h2 style="font-size:16px;margin:10px 0 6px;color:var(--text)">$1</h2>')
    .replace(/^## (.*)/gm,'<h3 style="font-size:14px;margin:8px 0 4px;color:var(--text2)">$1</h3>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.*?)`/g,'<code style="background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:11px">$1</code>')
    .replace(/\n/g,'<br>');
}

function tryEndpoint(){
  const ep=getEP();
  const overrideUrl=document.getElementById('try-url')?.value;
  const authToken=document.getElementById('try-auth')?.value;
  const bodyInput=document.getElementById('try-body')?.value;
  const qpStr=tryQPs.filter(q=>q.k).map(q=>`${encodeURIComponent(q.k)}=${encodeURIComponent(q.v)}`).join('&');

  let url=overrideUrl||(state.baseUrl+ep.path);
  if(qpStr)url+=(url.includes('?')?'&':'?')+qpStr;

  const resultDiv=document.getElementById('try-result');
  resultDiv.style.display='block';
  resultDiv.className='try-result';
  resultDiv.innerHTML='<span style="color:var(--text3)">⏳ Sending...</span>';

  // Schema validation
  if(ep.requestSchema&&bodyInput){
    try{
      const schema=JSON.parse(ep.requestSchema);
      const body=JSON.parse(bodyInput);
      const errs=validateAgainstSchema(body,schema);
      if(errs.length){
        resultDiv.innerHTML=`<span class="s4">⚠ Schema Validation Failed</span>\n${errs.map(e=>`  ✗ ${e}`).join('\n')}`;
        return;
      }
    }catch(e){}
  }

  // Determine response
  const active=ep.scenarios?.find(s=>s.id===ep.activeScenario);
  const statusCode=active?active.statusCode:ep.statusCode;
  let responseBody=active?active.body:ep.responseBody;
  responseBody=resolveFakers(responseBody);

  const headers=ep.headers.reduce((a,h)=>{if(h.key)a[h.key]=h.value;return a;},{});
  if(authToken)headers['Authorization']=authToken;

  setTimeout(()=>{
    const sClass=statusCode<300?'s2':statusCode<400?'s3':statusCode<500?'s4':'s5';
    resultDiv.innerHTML=`<span class="${sClass}">HTTP ${statusCode} ${getStatusText(statusCode)}</span> <span style="color:var(--text3)">[${ep.delay}ms delay]</span>
<span style="color:var(--text3)">→ ${url}</span>

<span style="color:var(--text2)">Response Headers:</span>
${Object.entries(headers).map(([k,v])=>`  ${k}: ${v}`).join('\n')}

<span style="color:var(--text2)">Response Body:</span>
${responseBody}
${active?`\n<span style="color:var(--yellow)">⚡ Scenario: ${active.name}</span>`:''}`
  },ep.delay||0);
}

function validateAgainstSchema(data,schema){
  const errs=[];
  if(schema.required){schema.required.forEach(k=>{if(!(k in data))errs.push(`Missing required field: "${k}"`);});}
  if(schema.properties){Object.entries(schema.properties).forEach(([k,def])=>{
    if(k in data){
      const t=def.type;const v=data[k];
      if(t==='string'&&typeof v!=='string')errs.push(`"${k}" must be string, got ${typeof v}`);
      if(t==='number'&&typeof v!=='number')errs.push(`"${k}" must be number`);
      if(t==='integer'&&(!Number.isInteger(v)))errs.push(`"${k}" must be integer`);
      if(t==='boolean'&&typeof v!=='boolean')errs.push(`"${k}" must be boolean`);
      if(t==='array'&&!Array.isArray(v))errs.push(`"${k}" must be array`);
      if(t==='object'&&(typeof v!=='object'||Array.isArray(v)))errs.push(`"${k}" must be object`);
    }
  });}
  return errs;
}

// ─── CODE SNIPPETS ────────────────────────────────────────────────────────────
function copySnippet(type){
  const ep=getEP();
  const url=state.baseUrl+ep.path;
  const hdrs=ep.headers.reduce((a,h)=>{if(h.key)a[h.key]=h.value;return a;},{});
  let s='';
  if(type==='curl'){
    const hStr=Object.entries(hdrs).map(([k,v])=>`  -H '${k}: ${v}' \\`).join('\n');
    s=`curl -X ${ep.method} '${url}' \\\n${hStr}\n  --max-time 30`;
  } else if(type==='fetch'){
    s=`const response = await fetch('${url}', {\n  method: '${ep.method}',\n  headers: ${JSON.stringify(hdrs,null,4)}\n});\nconst data = await response.json();\nconsole.log(data);`;
  } else if(type==='axios'){
    s=`import axios from 'axios';\n\nconst { data } = await axios.${ep.method.toLowerCase()}('${url}', {\n  headers: ${JSON.stringify(hdrs,null,4)}\n});\nconsole.log(data);`;
  } else if(type==='python'){
    const hPy=Object.entries(hdrs).map(([k,v])=>`    '${k}': '${v}'`).join(',\n');
    s=`import requests\n\nresponse = requests.${ep.method.toLowerCase()}(\n    '${url}',\n    headers={\n${hPy}\n    }\n)\nprint(response.json())`;
  } else if(type==='php'){
    s=`<?php\n$ch = curl_init();\ncurl_setopt($ch, CURLOPT_URL, '${url}');\ncurl_setopt($ch, CURLOPT_CUSTOMREQUEST, '${ep.method}');\ncurl_setopt($ch, CURLOPT_RETURNTRANSFER, true);\n$response = curl_exec($ch);\ncurl_close($ch);\n$data = json_decode($response, true);\nprint_r($data);`;
  }
  copyText(s);toast(`${type} snippet copied!`,'ti-copy');
}

function copyText(text){navigator.clipboard.writeText(text).catch(()=>{const el=document.createElement('textarea');el.value=text;document.body.appendChild(el);el.select();document.execCommand('copy');el.remove();});}

// ─── EXPORT / IMPORT ─────────────────────────────────────────────────────────
function exportOpenAPI(){
  const spec={openapi:'3.0.0',info:{title:'Mock API',version:'1.0.0'},servers:[{url:state.baseUrl}],paths:{}};
  state.endpoints.forEach(ep=>{
    if(!spec.paths[ep.path])spec.paths[ep.path]={};
    const parameters=ep.params.filter(p=>p.in!=='body').map(p=>({name:p.name,in:p.in,required:p.required,schema:{type:p.type},description:''}));
    const reqBody=ep.params.filter(p=>p.in==='body').length?{requestBody:{content:{[ep.contentType]:{schema:{type:'object'}}}}}:{};
    spec.paths[ep.path][ep.method.toLowerCase()]={
      summary:ep.description||ep.path,tags:ep.tags,parameters,
      ...reqBody,
      responses:{[ep.statusCode]:{description:getStatusText(ep.statusCode),content:{[ep.contentType]:{example:ep.responseBody}}}},
      security:ep.authRequired?[{bearerAuth:[]}]:[]
    };
  });
  if(state.endpoints.some(e=>e.authRequired))spec.components={securitySchemes:{bearerAuth:{type:'http',scheme:'bearer'}}};
  downloadJSON(spec,'openapi-spec.json');
  toast('OpenAPI 3.0 spec exported!','ti-file-code');
}

// Resolve a local $ref like "#/components/responses/Unauthorised" against the spec
function resolveRef(spec,ref){
  if(typeof ref!=='string'||!ref.startsWith('#/'))return null;
  return ref.slice(2).split('/').reduce((o,k)=>{
    if(!o)return null;
    k=k.replace(/~1/g,'/').replace(/~0/g,'~'); // JSON-pointer unescape
    return o[k];
  },spec);
}
// Follow a $ref one level (objects that are {"$ref": "..."})
function deref(spec,obj){
  let guard=0;
  while(obj&&obj.$ref&&guard++<20)obj=resolveRef(spec,obj.$ref);
  return obj||{};
}
// Pull the first concrete example out of a response/requestBody content map
function exampleFromContent(spec,content){
  if(!content)return null;
  const mediaType=Object.keys(content)[0];
  if(!mediaType)return null;
  const media=content[mediaType]||{};
  let value=null;
  if('example'in media){value=media.example;}
  else if(media.examples&&Object.keys(media.examples).length){
    const first=deref(spec,media.examples[Object.keys(media.examples)[0]]);
    value=first&&'value'in first?first.value:first;
  }else if(media.schema){
    const sch=deref(spec,media.schema);
    if('example'in sch)value=sch.example;
  }
  return {mediaType,value};
}
function toBody(value){
  if(value==null)return '';
  return typeof value==='string'?value:JSON.stringify(value,null,2);
}

function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const spec=JSON.parse(ev.target.result);
      if(!spec.paths){toast('No paths found in spec','ti-alert-circle');return;}
      let count=0;
      Object.entries(spec.paths).forEach(([path,methods])=>{
        // shared (path-level) parameters apply to every operation
        const sharedParams=Array.isArray(methods.parameters)?methods.parameters:[];
        Object.entries(methods).forEach(([method,rawDef])=>{
          if(!['get','post','put','patch','delete'].includes(method))return;
          const def=deref(spec,rawDef);
          const ep=newEP(count++);
          // OpenAPI {param} → Express :param so the server's matcher hits it
          ep.path=path.replace(/\{([^}]+)\}/g,':$1');
          ep.method=method.toUpperCase();
          ep.description=def.summary||def.description||'';
          ep.tags=def.tags||[];
          ep.notes=def.summary&&def.description?def.description:'';
          if(def.deprecated)ep.tags=[...ep.tags,'deprecated'];

          // ── Parameters (path / query / header) ──
          const allParams=[...sharedParams,...(def.parameters||[])].map(p=>deref(spec,p));
          ep.params=allParams.map(p=>{
            const sch=deref(spec,p.schema||{});
            return {
              name:p.name||'',
              in:['path','query','header','body'].includes(p.in)?p.in:'query',
              type:sch.type||'string',
              default:p.example!=null?String(p.example):(sch.default!=null?String(sch.default):''),
              required:!!p.required
            };
          });

          // ── Request body → schema tab + a body param ──
          const reqBody=def.requestBody?deref(spec,def.requestBody):null;
          if(reqBody&&reqBody.content){
            const rbType=Object.keys(reqBody.content)[0];
            const rbMedia=reqBody.content[rbType]||{};
            if(rbMedia.schema){
              const sch=deref(spec,rbMedia.schema);
              try{ep.requestSchema=JSON.stringify(sch,null,2);}catch{}
            }
            ep.params.push({name:'body',in:'body',type:'object',default:'',required:!!reqBody.required});
          }

          // ── Responses: success → main body, others/extra examples → scenarios ──
          const respEntries=Object.entries(def.responses||{});
          const codes=respEntries.map(([c])=>c);
          const successCode=codes.find(c=>/^2\d\d$/.test(c))||codes[0];
          ep.scenarios=[];
          respEntries.forEach(([code,rawResp])=>{
            const resp=deref(spec,rawResp);
            const content=resp.content||{};
            const mediaType=Object.keys(content)[0];
            const media=mediaType?content[mediaType]:null;

            // collect every named example (or the single example) for this code
            const variants=[];
            if(media){
              if('example'in media)variants.push({name:'',value:media.example});
              else if(media.examples)Object.entries(media.examples).forEach(([n,exRaw])=>{
                const ex=deref(spec,exRaw);
                variants.push({name:ex.summary||n,value:'value'in ex?ex.value:ex});
              });
              else{const ex=exampleFromContent(spec,content);if(ex&&ex.value!=null)variants.push({name:'',value:ex.value});}
            }

            if(code===successCode){
              const sc=parseInt(code);if(!isNaN(sc))ep.statusCode=sc;
              if(mediaType)ep.contentType=mediaType;
              // first variant becomes the default response body
              if(variants.length)ep.responseBody=toBody(variants[0].value);
              // remaining named variants become scenarios
              variants.slice(1).forEach(v=>ep.scenarios.push({
                id:crypto.randomUUID(),name:v.name||`${code} variant`,statusCode:sc,body:toBody(v.value)
              }));
            }else{
              const sc=parseInt(code)||500;
              if(variants.length){
                variants.forEach(v=>ep.scenarios.push({
                  id:crypto.randomUUID(),name:v.name||resp.description||`${code} response`,statusCode:sc,body:toBody(v.value)
                }));
              }else if(resp.description){
                ep.scenarios.push({id:crypto.randomUUID(),name:resp.description,statusCode:sc,
                  body:toBody({success:false,statusCode:sc,message:resp.description})});
              }
            }
          });

          // ── Auth / security ──
          ep.authRequired=Array.isArray(def.security)?def.security.length>0:!!(spec.security&&spec.security.length);

          state.endpoints.push(ep);
        });
      });
      if(spec.servers&&spec.servers[0]&&spec.servers[0].url)state.baseUrl=spec.servers[0].url;
      state.selected=state.endpoints.length?state.endpoints[state.endpoints.length-count].id:null;
      render();toast(`Imported ${count} endpoints with full data!`,'ti-upload');
    }catch(err){console.error(err);toast('Invalid JSON file','ti-alert-circle');}
  };
  reader.readAsText(file);
  e.target.value='';
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg,icon='ti-check',type='ok'){
  const r=document.getElementById('toast-root');
  const el=document.createElement('div');
  el.className=`toast toast-${type}`;
  el.innerHTML=`<i class="ti ${icon}" style="font-size:14px"></i>${msg}`;
  r.appendChild(el);
  setTimeout(()=>el.style.opacity='0',2000);
  setTimeout(()=>el.remove(),2300);
}

function init(){
  // Check URL state param
  try{
    const u=new URLSearchParams(window.location.search);
    if(u.has('state')){state={...state,...JSON.parse(atob(u.get('state')))};render();return;}
  }catch(e){}

  if(!load()){
    // Seed with examples
    const examples=[
      {method:'GET',path:'/api/users',description:'List all users',statusCode:200,tags:['users'],
       responseBody:JSON.stringify({success:true,data:[{id:1,name:"{{faker.name}}",email:"{{faker.email}}"},{id:2,name:"{{faker.name}}",email:"{{faker.email}}"}],total:2,timestamp:"{{timestamp}}"},null,2),
       params:[{name:'limit',in:'query',type:'integer',required:false,default:'20'},{name:'offset',in:'query',type:'integer',required:false,default:'0'}]},
      {method:'POST',path:'/api/users',description:'Create user',statusCode:201,tags:['users'],
       responseBody:JSON.stringify({success:true,data:{id:"{{random.int}}",name:"{{faker.name}}",email:"{{faker.email}}",createdAt:"{{timestamp}}"},message:"User created successfully"},null,2),
       requestSchema:JSON.stringify({type:'object',required:['name','email'],properties:{name:{type:'string'},email:{type:'string',format:'email'},role:{type:'string'}}},null,2)},
      {method:'GET',path:'/api/users/:id',description:'Get user by ID',statusCode:200,tags:['users'],
       responseBody:JSON.stringify({id:"{{random.int}}",name:"{{faker.name}}",email:"{{faker.email}}",role:"admin",phone:"{{faker.phone}}",createdAt:"{{timestamp}}"},null,2),
       params:[{name:'id',in:'path',type:'integer',required:true,default:''}]},
      {method:'PUT',path:'/api/users/:id',description:'Update user',statusCode:200,tags:['users'],
       responseBody:JSON.stringify({success:true,message:"User updated",data:{id:"{{random.int}}",updatedAt:"{{timestamp}}"}},null,2)},
      {method:'DELETE',path:'/api/users/:id',description:'Delete user',statusCode:204,tags:['users'],
       responseBody:''},
      {method:'POST',path:'/api/auth/login',description:'Login endpoint',statusCode:200,tags:['auth'],
       responseBody:JSON.stringify({token:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example","expiresIn":3600,user:{id:"{{random.int}}",email:"{{faker.email}}"}},null,2),
       scenarios:[{id:crypto.randomUUID(),name:'Invalid credentials',statusCode:401,body:JSON.stringify({success:false,error:"Invalid email or password"},null,2)}]},
    ];
    examples.forEach((ex,i)=>{
      const ep={...newEP(i),...ex,id:crypto.randomUUID()};
      if(!ep.headers)ep.headers=[{key:'Content-Type',value:'application/json'},{key:'Access-Control-Allow-Origin',value:'*'}];
      if(!ep.params)ep.params=[];
      if(!ep.scenarios)ep.scenarios=[];
      state.endpoints.push(ep);
    });
    state.selected=state.endpoints[0].id;
  }
  render();
  syncToServer();
}
